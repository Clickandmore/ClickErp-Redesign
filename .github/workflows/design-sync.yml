name: Design sync

# GitHub هو المرجع المركزي للتصميم.
# - نسخة كاملة (من المشروع الأساسي): اترك module فاضي → تستبدل ملفات التصميم في جذر المستودع
#   (‎*.html, screens.json, CHANGELOG.md, assets/, shots/, states/) وترفض أي نسخة رقمها مش أعلى من الحالية.
#   README.md بتاع الحزمة يتحط في design/PAGES.md، وdesign/pages/ فيها تحويلات للروابط القديمة.
# - موديول/اقتراح (من أي حساب تاني): اكتب اسم في module (مثلاً auth)
#   → يتحط في design/modules/<الاسم> من غير ما يلمس التصميم الأساسي.
# - بديل بدون لينك: ارفع zip في design/incoming/ (اسم يبدأ بـ module- = موديول).
on:
  push:
    paths:
      - 'design/incoming/*.zip'
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'رابط ملف التصميم المضغوط (zip)'
        required: true
      module:
        description: 'اسم الموديول (فاضي = نسخة كاملة للمشروع الأساسي)'
        required: false
        default: ''

permissions:
  contents: write

concurrency: design-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get zip
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          MODULE_IN: ${{ inputs.module }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in
          module="${MODULE_IN:-}"
          if [ -n "${ZIP_URL:-}" ]; then
            curl -fsSL "$ZIP_URL" -o /tmp/in/design.zip
          else
            f=$(ls -t design/incoming/*.zip | head -1)
            cp "$f" /tmp/in/design.zip
            base=$(basename "$f" .zip)
            case "$base" in module-*) module="${base#module-}" ;; esac
          fi
          module=$(printf '%s' "$module" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/^-*//;s/-*$//')
          echo "MODULE=$module" >> "$GITHUB_ENV"

      - name: Extract
        run: |
          set -euo pipefail
          mkdir -p /tmp/x
          unzip -q /tmp/in/design.zip -d /tmp/x
          src=$(find /tmp/x -name screens.json -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$src" ]; then
            src=$(find /tmp/x -name index.html -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2-)
          fi
          [ -n "$src" ] || { echo "::error::No index.html / screens.json found in zip"; exit 1; }

          if [ -n "$MODULE" ]; then
            dest="design/modules/$MODULE"
            label="module $MODULE"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -r "$src"/. "$dest"/
          else
            ver() { grep -m1 -oE '"version"[^"]*"v?[0-9]+(\.[0-9]+)*' "$1" 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)*' || true; }
            new=$(ver "$src/screens.json"); cur=$(ver screens.json)
            if [ -z "$new" ]; then echo "::error::screens.json has no version"; exit 1; fi
            if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$new" | sort -V | tail -1)" != "$new" -o "$cur" = "$new" ]; then
              echo "::error::Rejected: incoming v$new is not newer than published v$cur. Sync from GitHub first, then bump the version."
              exit 1
            fi
            label="v$new"
            # Replace only the design files at the repo root; never touch source/, public/, docs/, design/.
            rm -rf ./*.html screens.json CHANGELOG.md assets shots states
            for f in "$src"/* ; do
              b=$(basename "$f")
              case "$b" in
                README.md) cp "$f" design/PAGES.md ;;
                source|public|docs|design|.github) echo "::warning::skipped reserved name $b" ;;
                *) cp -r "$f" ./ ;;
              esac
            done
            # Old links under design/pages/ redirect to the root.
            rm -rf design/pages && mkdir -p design/pages
            for f in ./*.html; do
              b=$(basename "$f")
              printf '<!DOCTYPE html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Click ERP</title>\n<meta http-equiv="refresh" content="0; url=../../%s">\n<link rel="canonical" href="../../%s">\n<script>location.replace("../../%s" + location.search + location.hash);</script>\n</head><body><a href="../../%s">../../%s</a></body></html>\n' "$b" "$b" "$b" "$b" "$b" > "design/pages/$b"
            done
          fi
          rm -rf design/incoming
          echo "LABEL=$label" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          set -euo pipefail
          bot='github-actions[bot]'
          printf -v botmail '41898282+%s\x40users.noreply.github.com' "$bot"
          git config user.name "$bot"
          git config user.email "$botmail"
          git add -A .
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "design: ${LABEL} (auto sync)"
          git push
